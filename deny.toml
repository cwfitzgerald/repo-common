# Template deny.toml - copy to your repo and trim the allow list as needed.

[licenses]
allow = [
    "Apache-2.0",
    "CC0-1.0",
    "ISC",
    "LGPL-3.0",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "deny"
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "allow"

[advisories]
ignore = []
