name: "Install Rust"
description: "Install Rust"
inputs:
  version:
    description: "Rust toolchain version to install (e.g. 1.94, nightly)"
    required: true
  components:
    description: "Comma-separated list of components to install (e.g. clippy, rustfmt)"
    default: ""
  targets:
    description: "Comma-separated list of targets to install (e.g. x86_64-unknown-linux-gnu)"
    default: ""
runs:
  using: "composite"
  steps:
    - name: install rust
      shell: bash
      run: |
        set -e

        args=(--no-self-update --profile=minimal)
        if [ -n "${{ inputs.components }}" ]; then
          args+=(--component ${{ inputs.components }})
        fi
        if [ -n "${{ inputs.targets }}" ]; then
          args+=(--target ${{ inputs.targets }})
        fi

        rustup toolchain install ${{ inputs.version }} "${args[@]}"
        rustup override set ${{ inputs.version }}
